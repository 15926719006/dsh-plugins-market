<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="OpenCode Go quota gauge">
  <title>OpenCode Go quota</title>
  <!-- Original artwork: a subscription gauge whose filled arc is the quota still available. -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#1a73e8" stroke-opacity="0.24" stroke-width="7"/>
  <circle cx="32" cy="32" r="19" fill="none" stroke="#1a73e8" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="83.9 119.4" transform="rotate(-90 32 32)"/>
  <circle cx="32" cy="32" r="8.5" fill="#1a73e8" fill-opacity="0.14"/>
  <circle cx="32" cy="32" r="3.6" fill="#1a73e8"/>
  <circle cx="32" cy="13" r="2.6" fill="#1a73e8"/>
</svg>
