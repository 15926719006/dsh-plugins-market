# This bundle replaces the shipped workspace browser with a fork that lifts
# pinned Sessions into a leading "Pinned" section above every workspace group.
# Rebuilt from the installed dsh Client bundle by `node build/fork.mjs`.
- id: ui-workspace
  name: '@deepseek-ai/dsh-client-ui-workspace'
  disabled: true
- insert:
    - id: pinned-top-workspace
      name: '@local/dsh-pinned-top'
